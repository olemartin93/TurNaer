name: Update trip data

# Builds the static trip dataset the app loads at runtime, from:
# - Kartverket's national trail database (Turrutebasen) via its open WFS
# - OpenStreetMap (Geofabrik's Norway extract): hiking routes, named trails, summits
# and publishes it to the `data` branch, then redeploys the site.
on:
  schedule:
    - cron: "23 3 * * 1" # Mondays 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install osmium
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install osmium

      - name: Download and filter OpenStreetMap extract for Norway
        run: |
          mkdir -p data-build
          curl -fL --retry 5 --retry-delay 30 -o data-build/norway.osm.pbf \
            https://download.geofabrik.de/europe/norway-latest.osm.pbf
          osmium tags-filter data-build/norway.osm.pbf \
            r/route=hiking,foot w/highway=path w/sac_scale n/natural=peak \
            -o data-build/filtered.osm.pbf --overwrite
          rm data-build/norway.osm.pbf
          ls -lh data-build

      - name: Extract OpenStreetMap hiking data
        run: python scripts/data/extract_osm.py data-build/filtered.osm.pbf

      - name: Fetch Kartverket trail database (Turrutebasen)
        # If Kartverket's service is down, still publish the OpenStreetMap data.
        continue-on-error: true
        run: node scripts/data/fetch-turrutebasen.mjs

      - name: Build map-cell files
        run: TILES_OUT_DIR=data-out/tiles node scripts/data/build-tiles.mjs

      - name: Publish to the data branch
        run: |
          du -sh data-out/tiles
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan data
          mv data-out/tiles tiles
          printf '# TurNær trip data\n\nGenerated by the "Update trip data" workflow. Do not edit by hand.\n\nSources: Kartverket (Turrutebasen, NLOD/CC BY 4.0) and © OpenStreetMap contributors (ODbL).\n' > README.md
          git add tiles README.md
          git commit -q -m "Trip data $(date -u +%Y-%m-%d)"
          git push -f origin data

      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
